# Map for WebSocket upgrade (used by the live run-log stream at /api/run/ws).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Proxy all API + WebSocket traffic to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long-running workflow runs / streamed logs shouldn't time out.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Serve the built single-page app; fall back to index.html for client routes.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
